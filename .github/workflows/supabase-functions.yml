# Deploys the scheduled-job edge functions to Supabase whenever they change.
# Set two repository secrets in GitHub (Settings > Secrets and variables >
# Actions): SUPABASE_ACCESS_TOKEN (Supabase account > Access tokens) and
# SUPABASE_PROJECT_REF (the id in your project URL). Run it once by hand from
# the Actions tab after adding them.
name: Deploy Supabase edge functions
on:
  push:
    paths: ["supabase/functions/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.SKIP_SUPABASE_DEPLOY != 'true' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "Secrets not set; skipping."; exit 0; fi
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
          done
